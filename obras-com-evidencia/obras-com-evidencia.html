<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obras com Evidência – Build &amp; Design</title>
<meta name="description" content="Trabalhar connosco é ter uma Área de Cliente. Acompanhe a sua obra em tempo real, com planeamento, progresso e total transparência.">
<meta name="theme-color" content="#18343f" id="themeColor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design tokens — duas camadas
   1) PRIMITIVOS: a paleta bruta. Só são referenciados AQUI, nesta ficheiro.
   2) SEMÂNTICOS: o que cada cor "faz". O site (styles.css, app.js) usa apenas
      estes — nunca um primitivo nem um valor hexadecimal direto.
   Para mudar a marca, altere os primitivos ou o mapeamento semântico abaixo.
   ========================================================================== */
:root {
  /* ---------- primitivos ---------- */
  --petrol-600: #18343f;     /* azul petróleo (30%) */
  --petrol-700: #10252d;
  --bordeaux-600: #451a21;   /* bordô (10%) */
  --bordeaux-700: #32121a;
  --cream-bg: #e9e1d6;       /* marfim (60%): fundo */
  --cream-alt: #ddd3c5;      /* creme mais escuro: secções alternadas */
  --cream-line: #c8bdab;     /* bordas */
  --charcoal-700: #3a3a38;  /* cinza escuro (cabeçalho) */
  --stone-white: #f4f1ec;   /* branco-pedra: fundo geral */
  --sand-200: #e8e2d8;      /* areia: secções alternadas */
  --ink-900: #1c1a17;       /* quase-preto quente: texto e rodapé */
  --cream-50: #f7f2ee;
  --cream-100: #efe6dc;
  --cream-300: #e6dcd0;
  --warm-white: #fffdfc;
  --white: #ffffff;
  --black: #000000;

  --graphite-500: #2a5495;  /* azul do logótipo (substitui o cinzento) */
  --graphite-600: #1f4079;  /* hover */

  --green-500: #4a7c6a;
  --green-700: #2f5446;
  --red-500: #c8202a;
  --red-600: #b3322f;
  --logo-red: #d3191f;
  --sand-300: #d9c3a5;
  --gold-600: #523b21;

  --slate-900: #1c2733;
  --slate-500: #5b6571;

  --stone-1: #a9a49a; --stone-2: #6f6b64;   /* tons de obra para marcadores de fotografia */
  --stone-3: #b8b2a6; --stone-4: #7c8a93;
  --stone-5: #c2b8a8; --stone-6: #8a7a66;
  --stone-7: #9fa7a0; --stone-8: #5f6f68;
  --stone-9: #c9b9a3; --stone-10: #8d8a82;
  --stone-11: #9db0c2; --stone-12: #5d7791;
  --stone-13: #a8b8aa; --stone-14: #5c7a6a;
  --stone-15: #d9d3c9; --stone-16: #aaa397;
  --stone-17: #c4c4c4; --stone-18: #3a3a3a;
  --stone-19: #4a3e2c;

  /* ---------- semânticos ---------- */
  /* ação (botões principais, separador ativo) */
  --color-action: var(--bordeaux-600);
  --color-action-hover: var(--bordeaux-700);
  --color-on-action: var(--white);

  /* navegação (menus, separadores ativos): azul petróleo original */
  --color-nav-accent: var(--petrol-600);
  --color-nav-accent-hover: var(--petrol-700);
  --color-cta: var(--bordeaux-600);                /* botões da página inicial: Área de Cliente e Pedir Orçamento */
  --color-cta-hover: var(--bordeaux-700);
  --shadow-nav: 0 4px 14px color-mix(in srgb, var(--ink-900) 25%, transparent);

  /* marca / estrutura */
  --color-brand: var(--petrol-600);        /* títulos, barra lateral */
  --color-brand-2: var(--petrol-600);      /* estado "em execução", topo do gradiente */
  --color-on-brand: var(--white);
  --color-link: var(--petrol-600);
  --color-focus: var(--petrol-600);
  --color-accent: var(--gold-600);
  --color-accent-soft: var(--sand-300);
  --color-logo: var(--logo-red);

  /* superfícies e texto */
  --color-bg: var(--cream-bg);                /* fundo geral (60%) */
  --color-surface: var(--white);                 /* cartões e formulários */
  --color-surface-raised: var(--white);
  --color-surface-alt: var(--cream-alt);          /* superfície 2: secções alternadas */
  --color-border: var(--cream-line);
  --color-text: var(--ink-900);
  --color-text-muted: #444c56;
  --color-text-on-dark: var(--white);
  --color-text-soft: #333b46;
  --color-on-brand-muted: #e6e6e3;
  --color-shadow-ink: var(--black);
  --color-bg-inverse: var(--ink-900);            /* rodapé */
  --color-footer-bg: var(--color-bg-inverse);
  --color-footer-text: #cfc4b4;

  /* cabeçalho */
  --color-header-bg: #e9e1d6;
  --color-on-header: var(--bordeaux-600);
  --color-on-header-muted: #6d4f55;

  /* estados */
  --color-success: var(--green-500);
  --color-success-strong: var(--green-700);
  --color-danger: var(--red-600);
  --color-danger-bg: #fdf3f2;
  --color-danger-border: #f0d2d0;
  --color-warning-bg: #fff4d6;
  --color-warning-text: #6b5a1e;
  --color-warning-border: #ecdca4;
  --color-info-bg: #ececea;
  --color-success-bg: #e2efe9;

  /* barras do cronograma */
  --color-gantt-done: var(--stone-17);
  --color-gantt-done-text: var(--stone-18);
  --color-gantt-plan-text: var(--stone-19);

  /* sombras e sobreposições */
  --color-overlay: color-mix(in srgb, var(--ink-900) 55%, transparent);
  --color-shadow: color-mix(in srgb, var(--ink-900) 12%, transparent);
  --shadow-sm: 0 4px 16px color-mix(in srgb, var(--ink-900) 6%, transparent);
  --shadow-md: 0 10px 30px var(--color-shadow);
  --shadow-lg: 0 30px 60px color-mix(in srgb, var(--ink-900) 22%, transparent);
  --shadow-cta: 0 10px 28px color-mix(in srgb, var(--petrol-700) 40%, transparent);
  --shadow-action: 0 4px 14px color-mix(in srgb, var(--petrol-700) 28%, transparent);

  /* marcadores de fotografia (pares de gradiente) */
  --ph-a1: var(--stone-1); --ph-a2: var(--stone-2);
  --ph-b1: var(--stone-3); --ph-b2: var(--stone-4);
  --ph-c1: var(--stone-5); --ph-c2: var(--stone-6);
  --ph-d1: var(--stone-7); --ph-d2: var(--stone-8);
  --ph-p1: var(--stone-9); --ph-p2: var(--stone-10);
  --ph-p3: var(--stone-11); --ph-p4: var(--stone-12);
  --ph-p5: var(--stone-13); --ph-p6: var(--stone-14);
  --ph-m1: var(--stone-15); --ph-m2: var(--stone-16);

  /* tipografia e forma */
  --font-serif: 'Outfit', system-ui, sans-serif;
  --font-sans: 'Inter', system-ui, sans-serif;
  --radius: 12px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);color:var(--color-text);background:var(--color-bg);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--font-serif);font-weight:500;color:var(--color-text);line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--color-action);color:var(--color-on-action);padding:12px 24px;border-radius:8px;font-family:var(--font-serif);font-size:1.15rem;font-weight:500;box-shadow:var(--shadow-action);transition:.2s}
.btn:hover{background:var(--color-action-hover);transform:translateY(-1px)}
.btn.ghost{background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);box-shadow:none;font-family:var(--font-sans);font-size:.9rem;padding:8px 14px}
.btn.ghost:hover{background:var(--color-surface-alt)}
.btn.sm{font-family:var(--font-sans);font-size:.85rem;padding:8px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--color-bg) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:.2s}
.hdr.sc{border-color:var(--color-border)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:92px}
.logo svg{height:64px;width:auto;display:block}
.nav{display:flex;gap:34px;font-family:var(--font-serif);font-size:1.12rem}
.nav a{padding:4px 0;border-bottom:1px solid transparent;transition:.2s}
.nav a:hover{border-color:var(--color-accent);color:var(--color-accent)}
.hdr-r{display:flex;align-items:center;gap:18px}
.lang{display:flex;gap:6px;font-size:.88rem;letter-spacing:.04em}
.lang button{color:var(--color-text-muted);padding:2px 2px}
.lang button.on{color:var(--color-text);font-weight:500}
.burger{display:none;width:40px;height:40px;font-size:1.6rem;color:var(--color-text)}

/* hero */
.hero{padding:60px 0 70px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.6rem,5vw,4.2rem);margin-bottom:22px}
.hero p{font-size:1.25rem;color:var(--color-text-soft);font-weight:300;max-width:460px;margin-bottom:34px}
.mock{position:relative;border-radius:16px;box-shadow:var(--shadow-lg);background:var(--color-surface);overflow:hidden;display:grid;grid-template-columns:130px 1fr;min-height:340px;transform:perspective(1400px) rotateY(-4deg);transition:.4s}
.mock:hover{transform:none}
.mock-side{background:linear-gradient(180deg,var(--color-brand-2),var(--color-brand));padding:16px 10px;color:var(--color-on-brand-muted);font-size:.7rem;display:flex;flex-direction:column;gap:4px}
.mock-side i{display:block;padding:7px 8px;border-radius:6px;font-style:normal}
.mock-side i.on{background:color-mix(in srgb, var(--color-on-brand) 14%, transparent)}
.mock-main{padding:18px}
.mock-main h4{font-family:var(--font-serif);font-size:1.2rem;color:var(--color-text);font-weight:500}
.mock-main small{color:var(--color-text-muted);font-size:.7rem}
.mini-bar{height:7px;border-radius:4px;background:var(--color-surface-alt);margin:6px 0 12px;overflow:hidden}
.mini-bar b{display:block;height:100%;background:var(--color-success);border-radius:4px}
.mock-card{background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:10px;padding:12px;margin-top:10px;font-size:.72rem}
.mock-card .row{display:flex;justify-content:space-between;margin-top:6px}

/* sections */
.sec{padding:90px 0}
.sec.alt{background:var(--color-surface-alt)}
.sec h2{font-size:clamp(2rem,3.6vw,3rem);text-align:center;margin-bottom:12px}
.sec .lead{text-align:center;color:var(--color-text-muted);font-size:1.1rem;max-width:640px;margin:0 auto 48px;font-weight:300}
.eyebrow{display:block;text-align:center;letter-spacing:.3em;font-size:.75rem;color:var(--color-accent);margin-bottom:10px;text-transform:uppercase}

/* testimonials */
.testi h2{color:var(--color-accent)}
.carousel{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:16px}
.arrow{width:42px;height:42px;border-radius:50%;background:var(--color-surface-raised);box-shadow:var(--shadow-md);font-size:1.2rem;color:var(--color-text);flex:none}
.slide{flex:1;background:var(--color-surface-raised);border-radius:12px;box-shadow:var(--shadow-md);padding:22px 26px;display:flex;align-items:center;gap:22px;min-height:120px;animation:fade .6s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.avatar{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-serif);font-size:1.7rem;color:var(--color-on-brand);background:var(--color-brand)}
.slide q{font-family:var(--font-serif);font-size:1.45rem;color:var(--color-text);quotes:"“" "”";flex:1;line-height:1.3}
.slide cite{font-style:normal;color:var(--color-text-muted);font-size:.9rem;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:8px;margin-top:20px}
.dots button{width:8px;height:8px;border-radius:50%;background:var(--color-accent-soft)}
.dots button.on{background:var(--color-nav-accent);width:22px;border-radius:5px}

/* about / services / projects / contact */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-sm)}
.card h3{font-size:1.55rem;margin-bottom:8px}
.card p{color:var(--color-text-soft);font-weight:300}
.ico{width:46px;height:46px;border-radius:10px;background:var(--color-surface-alt);display:grid;place-items:center;color:var(--color-text);margin-bottom:16px;font-size:1.3rem}
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about h2,.about .eyebrow{text-align:left}
.about p{margin-bottom:14px;color:var(--color-text-soft);font-weight:300;font-size:1.08rem}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pillar{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:22px;text-align:center}
.pillar b{font-family:var(--font-serif);font-size:1.5rem;color:var(--color-text);display:block;font-weight:500}
.pillar span{font-size:.85rem;color:var(--color-text-muted)}
.proj{border-radius:var(--radius);overflow:hidden;background:var(--color-surface-raised);border:1px solid var(--color-border);box-shadow:var(--shadow-sm)}
.proj .img{height:200px;background:linear-gradient(135deg,var(--ph-p1),var(--ph-p2));position:relative}
.proj:nth-child(2) .img{background:linear-gradient(135deg,var(--ph-p3),var(--ph-p4))}
.proj:nth-child(3) .img{background:linear-gradient(135deg,var(--ph-p5),var(--ph-p6))}
.proj .img::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,color-mix(in srgb, var(--color-on-brand) 7%, transparent) 0 2px,transparent 2px 60px)}
.proj div.t{padding:18px 22px}
.proj h3{font-size:1.4rem}
.proj span{font-size:.85rem;color:var(--color-text-muted)}
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:48px}
.contact h2,.contact .eyebrow{text-align:left}
.contact ul{list-style:none;margin-top:24px;display:grid;gap:12px;color:var(--color-text-soft)}
form.f{display:grid;gap:14px}
.f label{font-size:.82rem;color:var(--color-text-muted);display:grid;gap:6px}
.f input,.f textarea,.f select{padding:12px 14px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface-raised);outline:none}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--color-link);box-shadow:0 0 0 3px color-mix(in srgb, var(--color-focus) 15%, transparent)}
.ftr{background:var(--color-footer-bg);color:var(--color-footer-text);padding:40px 0;text-align:center;font-size:.9rem}
.ftr svg{height:70px;margin-bottom:14px}
.float-cta{position:fixed;right:28px;bottom:28px;z-index:60;border-radius:999px;padding:14px 28px;box-shadow:var(--shadow-cta)}

/* modal */
.modal{position:fixed;inset:0;background:var(--color-overlay);display:none;place-items:center;z-index:100;padding:20px}
.modal.open{display:grid}
.modal .box{background:var(--color-surface);border-radius:16px;padding:32px;width:100%;max-width:440px;box-shadow:0 30px 80px color-mix(in srgb, var(--color-shadow-ink) 35%, transparent);position:relative}
.modal h3{font-size:2rem;margin-bottom:6px}
.modal .sub{color:var(--color-text-muted);font-size:.92rem;margin-bottom:20px}
.modal .x{position:absolute;top:14px;right:16px;font-size:1.5rem;color:var(--color-text-muted)}
.hint{font-size:.78rem;color:var(--color-text-muted);margin-top:12px;text-align:center}

/* ============ CLIENT AREA ============ */
.ca{display:grid;grid-template-columns:280px 1fr;min-height:100vh;background:var(--color-bg)}
.side{background:var(--color-bg);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .logo{padding:0 12px 20px}
.side .logo svg{height:84px}
.menu{background:linear-gradient(180deg,var(--color-brand-2),var(--color-brand));border-radius:14px 14px 0 0;padding:16px 10px;flex:1;display:flex;flex-direction:column;gap:2px;overflow:auto}
.menu a{display:flex;align-items:center;gap:14px;color:var(--color-on-brand-muted);padding:12px 14px;border-radius:8px;font-family:var(--font-serif);font-size:1.15rem;transition:.15s}
.menu a:hover{background:color-mix(in srgb, var(--color-on-brand) 8%, transparent)}
.menu a.on{background:color-mix(in srgb, var(--color-on-brand) 18%, transparent);color:var(--color-on-brand)}
.menu a .i{width:22px;text-align:center;opacity:.9}
.menu .user{margin-top:auto;padding:14px;display:flex;align-items:center;gap:12px;border-top:1px solid color-mix(in srgb, var(--color-on-brand) 15%, transparent);color:var(--color-on-brand);font-family:var(--font-serif);font-size:1.05rem;line-height:1.15}
.menu .user .avatar{width:44px;height:44px;font-size:1.1rem;border:2px solid var(--color-on-brand)}
.menu .user button{margin-left:auto;color:var(--color-on-brand-muted);font-size:.8rem;text-decoration:underline}
.main{padding:0 40px 60px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border);height:74px;margin:0 -40px 30px;padding:0 40px}
.tabs{display:flex;gap:24px;font-size:1.02rem}
.tabs span{padding:26px 2px 22px;border-bottom:2px solid transparent;color:var(--color-text-muted)}
.tabs span.on{color:var(--color-text);border-color:var(--color-nav-accent)}
.top-r{display:flex;align-items:center;gap:16px}
.top-r .avatar{width:38px;height:38px;font-size:.95rem}
.mburger{display:none}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.page-h h1{font-size:2.4rem}
.page-h p{color:var(--color-text-soft);font-weight:300;margin-top:6px}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--color-text-muted);font-size:.95rem;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--color-success);display:inline-block}
.panel{background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow-sm)}
.panel h3{font-size:1.5rem;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;align-items:start}
.stack{display:grid;gap:22px}
.pbar{display:flex;align-items:center;gap:20px}
.bar{flex:1;height:14px;background:var(--color-surface-alt);border-radius:7px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--color-brand-2);border-radius:7px;transition:width .8s}
.bar.g b{background:var(--color-success)}
.bar.s b{background:var(--color-accent-soft)}
.big{font-family:var(--font-serif);font-size:2.2rem;color:var(--color-text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:18px;border-top:1px solid var(--color-border);padding-top:16px}
.two div+div{border-left:1px solid var(--color-border);padding-left:22px}
.two small{display:block;color:var(--color-text-muted)}
.two b{font-family:var(--font-serif);font-size:1.3rem;font-weight:500;color:var(--color-text)}
.upd{list-style:none;display:grid;gap:4px}
.upd li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--color-surface-alt);font-size:.95rem}
.upd li:first-child{border:0}
.upd .ic{width:30px;height:30px;border-radius:50%;background:var(--color-surface-alt);display:grid;place-items:center;font-size:.85rem;flex:none}
.upd em{font-style:normal;color:var(--color-text-muted);margin-left:auto;font-size:.85rem;white-space:nowrap}
.ok{color:var(--color-success-strong);display:inline-flex;align-items:center;gap:6px;font-size:.95rem}
.ok::before{content:"✓";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--color-success);color:var(--color-on-brand);font-size:.72rem}
.tag{font-size:.85rem;color:var(--color-text-muted)}
.note{display:flex;align-items:center;gap:10px;color:var(--color-text-soft);font-size:.9rem;margin-top:20px}
.note::before{content:"✓";width:22px;height:22px;border-radius:5px;border:1px solid var(--color-border);display:grid;place-items:center;color:var(--color-success);font-size:.8rem;flex:none}

/* mini cronograma */
.ph{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:14px;padding:10px 0}
.ph .n{text-transform:uppercase;font-size:.9rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.chk{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:.7rem;color:var(--color-on-brand);background:var(--color-accent-soft);flex:none}
.chk.done{background:var(--color-success)}.chk.run{background:var(--color-brand-2)}
.ph .v{text-align:right;font-family:var(--font-serif);font-size:1.2rem}

/* gantt */
.meta{text-align:right;color:var(--color-text-soft);display:grid;gap:4px;font-size:.95rem}
.meta b{font-weight:500}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:.9rem;margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.gantt{overflow-x:auto}
.g-in{min-width:760px;position:relative}
.g-head,.g-row{display:grid;grid-template-columns:200px 1fr;align-items:center}
.g-scale{display:grid;grid-template-columns:repeat(12,1fr);font-size:.75rem;color:var(--color-text-muted);border-left:1px solid var(--color-border)}
.g-scale span{padding:4px 6px;border-right:1px dashed var(--color-border)}
.g-row{border-top:1px solid var(--color-surface-alt);min-height:58px}
.g-row .n{display:flex;align-items:center;gap:10px;font-size:.98rem}
.g-track{position:relative;height:58px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/12 - 1px),var(--color-surface-alt) calc(100%/12 - 1px) calc(100%/12))}
.g-bar{position:absolute;top:16px;height:26px;border-radius:5px;font-size:.78rem;display:flex;align-items:center;padding:0 10px;color:var(--color-on-brand);white-space:nowrap;overflow:hidden;cursor:pointer;transition:.2s}
.g-bar:hover{filter:brightness(1.08);transform:scaleY(1.1)}
.g-bar.done{background:var(--color-gantt-done);color:var(--color-gantt-done-text)}.g-bar.run{background:var(--color-brand-2)}.g-bar.plan{background:var(--color-accent-soft);color:var(--color-gantt-plan-text)}
.g-pct{position:absolute;top:17px;font-family:var(--font-serif);font-size:1.15rem}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--color-logo);opacity:.55;z-index:2}
.g-tip{position:absolute;z-index:5;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:10px;box-shadow:var(--shadow-md);padding:12px 16px;font-size:.88rem;pointer-events:none;display:none;min-width:200px}
.g-tip div{display:flex;justify-content:space-between;gap:16px;padding:2px 0}

/* progress cards */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pg .full{grid-column:1/-1}
.sp{display:flex;flex-direction:column;gap:8px}
.sp header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--color-surface-alt);padding-bottom:8px}
.sp h3{margin:0;font-size:1.4rem}
.sp .pc{font-family:var(--font-serif);font-size:1.5rem}
.sp .row{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--color-text-soft);font-size:.95rem}
.link{color:var(--color-text);font-size:.92rem;text-align:left}
.link:hover{text-decoration:underline}

/* photos */
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.seg{display:inline-flex;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:8px;overflow:hidden}
.seg button{padding:10px 16px;border-right:1px solid var(--color-border);font-size:.92rem;color:var(--color-text-soft)}
.seg button:last-child{border:0}
.seg button.on{background:var(--color-surface-alt);color:var(--color-text)}
.sel{padding:10px 14px;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:8px;font-size:.92rem}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.photo{background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm)}
.photo .im{height:150px;position:relative}
.photo .im .c{position:absolute;right:10px;bottom:10px;background:var(--color-surface-raised);border-radius:6px;padding:2px 8px;font-size:.78rem}
.photo .b{padding:10px 12px;display:grid;gap:8px}
.photo .cap{font-size:.9rem;display:flex;justify-content:space-between}
.cm{display:flex;gap:6px}
.cm input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:.82rem;background:var(--color-bg)}
.cm button{background:var(--color-link);color:var(--color-on-brand);border-radius:6px;padding:0 10px}
.cl{list-style:none;font-size:.8rem;color:var(--color-text-soft);display:grid;gap:4px}
.cl b{font-weight:500}
.im.demo1{background:linear-gradient(135deg,var(--ph-a1),var(--ph-a2))}
.im.demo2{background:linear-gradient(135deg,var(--ph-b1),var(--ph-b2))}
.im.demo3{background:linear-gradient(135deg,var(--ph-c1),var(--ph-c2))}
.im.demo4{background:linear-gradient(135deg,var(--ph-d1),var(--ph-d2))}
.im::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,color-mix(in srgb, var(--color-shadow-ink) 5%, transparent) 0 2px,transparent 2px 14px),repeating-linear-gradient(90deg,color-mix(in srgb, var(--color-on-brand) 7%, transparent) 0 1px,transparent 1px 40px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:10px;padding:14px 18px;cursor:pointer;transition:.2s}
.stat:hover{border-color:var(--color-link)}
.stat h4{font-family:var(--font-serif);font-size:1.15rem;font-weight:500;color:var(--color-text)}
.stat span{font-size:.85rem;color:var(--color-text-muted)}

/* finance */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow-sm)}
.kpi{padding:22px 12px;text-align:center;border-right:1px solid var(--color-surface-alt)}
.kpi:last-child{border:0}
.kpi b{display:block;font-family:var(--font-serif);font-size:1.7rem;font-weight:500}
.kpi.g b{color:var(--color-success)}
.kpi small{color:var(--color-text-muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td,.tbl th{padding:13px 8px;border-top:1px solid var(--color-surface-alt);text-align:left;font-weight:400}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:first-child td{border-top:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.sec-h h3{margin:0;font-size:1.45rem}

/* materials */
.mtabs{display:flex;gap:28px;border-bottom:1px solid var(--color-border);margin-bottom:20px}
.mtabs button{padding:12px 4px;color:var(--color-text-muted);border-bottom:2px solid transparent;font-size:1rem}
.mtabs button.on{color:var(--color-text);border-color:var(--color-nav-accent)}
.mat-cols{display:grid;grid-template-columns:1.8fr 1fr;gap:22px;align-items:start}
.room{border:1px solid var(--color-border);border-radius:10px;margin-bottom:12px;background:var(--color-surface-raised);overflow:hidden}
.room>button{width:100%;text-align:left;padding:14px 18px;font-family:var(--font-serif);font-size:1.3rem;color:var(--color-text);display:flex;justify-content:space-between}
.mat{display:grid;grid-template-columns:62px 1fr;border-top:1px solid var(--color-surface-alt)}
.mat .sw2{background:linear-gradient(135deg,var(--ph-m1),var(--ph-m2))}
.mat .bd{padding:12px 16px;display:grid;gap:8px}
.mat .tt{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-serif);font-size:1.2rem;gap:10px;flex-wrap:wrap}
.mat .pv{display:flex;gap:22px;flex-wrap:wrap;font-size:.9rem;color:var(--color-text-soft);align-items:center}
.pv b{font-weight:500}
.over{color:var(--color-danger)}
.good{color:var(--color-success-strong)}
.warnbox{background:var(--color-danger-bg);border:1px solid var(--color-danger-border);border-radius:8px;padding:12px 14px;display:grid;gap:10px;font-size:.92rem}
.warnbox label{display:flex;gap:10px;align-items:center;cursor:pointer}
.balance{display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.balance::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.state{font-size:.85rem;padding:3px 10px;border-radius:20px;background:var(--color-surface-alt)}
.state.ap{background:var(--color-success-bg);color:var(--color-success-strong)}
.state.sel{background:var(--color-info-bg);color:var(--color-text)}
.hist{list-style:none}
.hist li{padding:12px 0;border-top:1px solid var(--color-surface-alt);display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.hist li:first-child{border:0}
.hist small{color:var(--color-text-muted);display:block}
.rule{display:grid;gap:4px;font-size:.88rem;color:var(--color-text-soft);margin-top:18px}

/* chat */
.chat{display:grid;grid-template-columns:1.6fr 1fr;border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface-raised);overflow:hidden;height:620px}
.chat-m{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--color-border)}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--color-surface-alt)}
.chat-h .avatar{width:44px;height:44px;font-size:1rem}
.chat-h b{font-weight:500}
.chat-h small{color:var(--color-success-strong);display:flex;align-items:center;gap:6px}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--color-bg)}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;background:var(--color-surface-raised);font-size:.95rem;box-shadow:0 1px 3px color-mix(in srgb, var(--color-shadow-ink) 6%, transparent)}
.msg.me{align-self:flex-end;background:var(--color-info-bg)}
.msg time{display:block;text-align:right;font-size:.72rem;color:var(--color-text-muted);margin-top:4px}
.msg .th{display:flex;gap:8px;margin-top:8px}
.msg .th i{width:70px;height:52px;border-radius:5px;display:block;background:linear-gradient(135deg,var(--ph-a1),var(--ph-a2))}
.composer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--color-surface-alt);align-items:center}
.composer input[type=text]{flex:1;border:0;outline:none;padding:8px;font-size:.95rem}
.composer .att{color:var(--color-text);font-size:1.2rem;padding:4px 8px}
.chat-s{padding:18px 22px;overflow:auto}
.chat-s h3{font-size:1.4rem;margin-bottom:10px}
.chat-s li{list-style:none;padding:12px 0;border-top:1px solid var(--color-surface-alt);font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.chat-s small{color:var(--color-text-muted)}
.chat-s li div small{display:block}

/* docs */
.docs{display:grid;gap:10px}
.doc{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:10px}
.doc .ic{width:38px;height:44px;border-radius:5px;background:var(--color-surface-alt);display:grid;place-items:center;font-size:.7rem;color:var(--color-text);font-weight:500}
.doc div{flex:1}
.doc small{color:var(--color-text-muted);display:block}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.dl dt{color:var(--color-text-muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;margin-top:12px}
.dl dd{font-family:var(--font-serif);font-size:1.25rem}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:var(--color-brand);color:var(--color-on-brand);padding:12px 22px;border-radius:30px;opacity:0;pointer-events:none;transition:.3s;z-index:200;font-size:.92rem;box-shadow:var(--shadow-md)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:980px){
  .hero .wrap,.about,.contact{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .nav{display:none}
  .nav.open{display:flex;position:absolute;top:92px;left:0;right:0;background:var(--color-surface);flex-direction:column;padding:20px 24px;gap:16px;border-bottom:1px solid var(--color-border)}
  .burger{display:block}
  .mock{transform:none}
  .ca{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:90;transform:translateX(-100%);transition:.3s;height:100%}
  .side.open{transform:none;box-shadow:10px 0 40px color-mix(in srgb, var(--color-shadow-ink) 30%, transparent)}
  .main{padding:0 18px 50px}
  .topbar{margin:0 -18px 22px;padding:0 18px}
  .mburger{display:block;font-size:1.5rem;margin-right:12px;color:var(--color-text)}
  .tabs{display:none}
  .cols,.mat-cols,.chat{grid-template-columns:1fr}
  .chat{height:auto}.chat-m{height:560px;border:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .pg{grid-template-columns:1fr}
  .ph{grid-template-columns:120px 1fr 56px}
}
@media(max-width:560px){
  .hdr .wrap{height:76px}.logo svg{height:50px}
  .hdr-r .btn{padding:8px 12px;font-size:.95rem}
  .slide{flex-direction:column;text-align:center}.slide cite{white-space:normal}
  .float-cta{right:14px;bottom:14px;padding:12px 20px}
  .carousel .arrow{display:none}
}

/* ===== versão funcional: banner, painel da equipa ===== */
.banner{background:var(--color-warning-bg);color:var(--color-warning-text);text-align:center;font-size:.82rem;padding:6px 12px;border-bottom:1px solid var(--color-warning-border)}
.err{color:var(--color-danger);font-size:.88rem;min-height:1.2em}
.demo-links{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:.82rem}
.demo-links button{color:var(--color-text);text-decoration:underline}
.ph-grid .im{background-size:cover;background-position:center}
.ph-grid .im img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.ba figure{border-radius:10px;overflow:hidden;border:1px solid var(--color-border)}
.ba .im{height:220px;position:relative}
.ba figcaption{padding:8px 12px;font-size:.88rem;color:var(--color-text-muted);background:var(--color-surface-raised)}
.modal .box.wide{max-width:760px}
.msg .att{display:inline-block;margin-top:6px;font-size:.85rem;color:var(--color-text);text-decoration:underline}
.msg .nm{font-size:.74rem;color:var(--color-text-muted);display:block;margin-bottom:2px}

.st .menu a{font-size:1.05rem}
.stbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.stbar a{padding:9px 16px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface-raised);font-size:.92rem;color:var(--color-text-soft)}
.stbar a.on{background:var(--color-nav-accent);color:var(--color-on-brand);border-color:var(--color-nav-accent)}
.plist{display:grid;gap:12px}
.pcard{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:16px;align-items:center;background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:10px;padding:16px 20px;transition:.15s}
.pcard:hover{border-color:var(--color-link);box-shadow:var(--shadow-md)}
.pcard b{font-family:var(--font-serif);font-size:1.3rem;font-weight:500;color:var(--color-text)}
.pcard small{color:var(--color-text-muted);display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fgrid .wide2{grid-column:span 2}
.f.row-card{background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:10px;padding:16px;margin-bottom:12px}
.f.row-card h4{font-family:var(--font-serif);font-size:1.25rem;color:var(--color-text);font-weight:500;margin-bottom:4px}
.chkl{display:flex!important;align-items:center;gap:8px;grid-auto-flow:column;justify-content:start}
.chkl input{width:auto}
.btns{display:flex;gap:8px;align-items:center}
.btn.danger{background:var(--color-surface-raised);color:var(--color-danger);border:1px solid var(--color-danger-border);box-shadow:none}
.sgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:16px}
.sgal .photo .im{height:120px}
.hint2{color:var(--color-text-muted);font-size:.85rem}
@media(max-width:980px){.pcard{grid-template-columns:1fr}.fgrid .wide2{grid-column:auto}}

/* miniaturas do mockup */
.tile{flex:1;height:54px;border-radius:5px}
.ph-a{background:linear-gradient(135deg,var(--ph-a1),var(--ph-a2))}
.ph-b{background:linear-gradient(135deg,var(--ph-b1),var(--ph-b2))}
.ph-c{background:linear-gradient(135deg,var(--ph-c1),var(--ph-c2))}

/* botão do menu (cabeçalho): azul petróleo */
.hdr .btn{background:var(--color-nav-accent);color:var(--color-on-brand);box-shadow:var(--shadow-nav)}
.hdr .btn:hover{background:var(--color-nav-accent-hover)}

/* botões de destaque da página inicial: azul do dashboard */
.hero .btn,.float-cta{background:var(--color-cta);color:var(--color-on-brand);box-shadow:var(--shadow-nav)}
.hero .btn:hover,.float-cta:hover{background:var(--color-cta-hover)}

/* ---- chatbot (canto inferior direito) ---- */
.float-cta{right:96px}
.bot-fab{position:fixed;right:28px;bottom:28px;z-index:70;width:56px;height:56px;border-radius:50%;background:var(--color-cta);color:var(--color-on-brand);font-size:1.4rem;box-shadow:var(--shadow-nav);transition:.2s;display:grid;place-items:center}
.bot-fab:hover{background:var(--color-cta-hover);transform:translateY(-2px)}
.bot-fab:focus-visible,.bot-panel button:focus-visible,.bot-f input:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
.bot-panel{position:fixed;right:28px;bottom:96px;z-index:70;width:360px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 130px);background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden;color:var(--color-text)}
.bot-panel.open{display:flex;animation:fade .25s}
.bot-panel header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(180deg,var(--color-brand-2),var(--color-brand));color:var(--color-on-brand)}
.bot-panel header b{display:block;font-family:var(--font-serif);font-size:1.25rem;font-weight:500;line-height:1.1}
.bot-panel header small{color:var(--color-on-brand-muted);font-size:.78rem}
.bot-panel header #botX{margin-left:auto;color:var(--color-on-brand);font-size:1.1rem;padding:4px 8px}
.bot-av{width:38px;height:38px;border-radius:50%;background:var(--color-on-brand);color:var(--color-text);display:grid;place-items:center;font-family:var(--font-serif);font-size:1.3rem;flex:none}
.bot-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--color-bg)}
.bot-m{max-width:86%;padding:10px 14px;border-radius:14px;font-size:.93rem;line-height:1.45;background:var(--color-surface);box-shadow:0 1px 3px color-mix(in srgb, var(--color-shadow-ink) 8%, transparent);display:grid;gap:8px;justify-items:start}
.bot-m.user{align-self:flex-end;background:var(--color-info-bg)}
.bot-act{background:var(--color-cta);color:var(--color-on-brand);border-radius:8px;padding:7px 12px;font-size:.84rem}
.bot-act:hover{background:var(--color-cta-hover)}
.bot-m.typing{display:flex;gap:4px;padding:14px}
.bot-m.typing i{width:7px;height:7px;border-radius:50%;background:var(--color-text-muted);animation:botdot 1s infinite}
.bot-m.typing i:nth-child(2){animation-delay:.15s}.bot-m.typing i:nth-child(3){animation-delay:.3s}
@keyframes botdot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.bot-chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--color-border);background:var(--color-surface)}
.bot-chips button{border:1px solid var(--color-border);border-radius:999px;padding:5px 11px;font-size:.8rem;color:var(--color-text);background:var(--color-surface)}
.bot-chips button:hover{background:var(--color-surface-alt)}
.bot-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--color-border);background:var(--color-surface)}
.bot-f input{flex:1;min-width:0;border:1px solid var(--color-border);border-radius:8px;padding:9px 12px;background:var(--color-bg);outline:none;font-size:.93rem}
.bot-f button{background:var(--color-cta);color:var(--color-on-brand);border-radius:8px;padding:0 14px}
@media(max-width:560px){.float-cta{right:84px;bottom:14px}.bot-fab{right:14px;bottom:14px;width:52px;height:52px}.bot-panel{right:8px;left:8px;width:auto;max-width:none;bottom:78px}}

(function () {
  'use strict';
  const cfg = window.OCE_CONFIG || {};

  const KINDS = ['dem', 'str', 'net', 'cov', 'car', 'fin'];
  const iso = d => d.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const today = () => iso(new Date());
  const diffDays = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
  const safeName = n => String(n).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_');

  // fases por omissão, repartidas entre início e fim da obra
  function defaultPhases(start, end) {
    const total = Math.max(diffDays(start, end), KINDS.length);
    const w = [.14, .24, .18, .16, .14, .14]; let acc = 0;
    return KINDS.map((kind, i) => {
      const ps = addDays(start, Math.round(total * acc)); acc += w[i];
      const pe = addDays(start, Math.round(total * acc) - 1);
      return { kind, name: null, sort: i, ps, pe, as: null, ae: null, pct: 0, status: 'planned', validated: false, note: '' };
    });
  }

      live: false,
      async init() {},
      user() { return me; },
      async signIn(email) {

        me = staff ? { id: 'staff1', email, name: 'Equipa Obras com Evidência', role: 'staff' } : { id: 'cli1', email, name: 'Álvaro Fernandes', role: 'client' };

      async addComment(pid, photoId, body) { const p = get(pid).photos.find(x => x.id === photoId); const c = { id: id(), author: me.name, body, at: today() }; p.comments.push(c); return c; },
      async sendMessage(pid, body, file) {
        const m = { id: id(), staff: me.role === 'staff', name: me.name, body, at: new Date().toISOString(), att: file ? fileInfo(file) : null };
        get(pid).messages.push(m); return m;

      async confirmMaterial(pid, mid, accept) {

      async savePhase(pid, ph) { Object.assign(get(pid).phases.find(x => x.id === ph.id), ph); },
      async addPhoto(pid, phaseId, file, caption, date) { const b = get(pid); const i = fileInfo(file); const p = { id: id(), phaseId, url: i.url, cls: null, caption, date: date || today(), comments: [] }; b.photos.push(p); return p; },
      async deletePhoto(pid, photoId) { const b = get(pid); b.photos = b.photos.filter(x => x.id !== photoId); },
      async saveMaterial(pid, m) { const b = get(pid); if (m.id) Object.assign(b.materials.find(x => x.id === m.id), m); else b.materials.push({ ...m, id: id(), accepted: false, decided: null }); },
      async deleteMaterial(pid, mid) { const b = get(pid); b.materials = b.materials.filter(x => x.id !== mid); },
      async saveAddendum(pid, a) { const b = get(pid); if (a.id) Object.assign(b.addenda.find(x => x.id === a.id), a); else b.addenda.push({ ...a, id: id() }); },
      async savePayment(pid, a) { const b = get(pid); if (a.id) Object.assign(b.payments.find(x => x.id === a.id), a); else b.payments.push({ ...a, id: id() }); },
      async addDocument(pid, cat, file) { get(pid).documents.push({ id: id(), cat, name: file.name, url: URL.createObjectURL(file), size: file.size }); },
      async deleteDocument(pid, did) { const b = get(pid); b.documents = b.documents.filter(x => x.id !== did); },
      async addUpdate(pid, kind, text) { get(pid).updates.unshift({ id: id(), kind, text, at: new Date().toISOString() }); }

  /* =============== SUPABASE =============== */
  function supa() {
    let sb, me = null; const BUCKET = 'obra-files';
    const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Falha a carregar o Supabase')); document.head.appendChild(s); });
    const chk = r => { if (r.error) throw new Error(r.error.message); return r.data; };
    const num = v => (v === null || v === undefined ? null : +v);
    const mapProject = r => ({ id: r.id, name: r.name, address: r.address, status: r.status, start: r.start_date, end: r.end_date, area: r.area, base: num(r.base_budget) || 0, mgrName: r.manager_name, mgrRole: r.manager_role, clientName: r.client?.name || '', clientId: r.client_id });
    const mapPhase = r => ({ id: r.id, kind: r.kind, name: r.name, sort: r.sort, ps: r.planned_start, pe: r.planned_end, as: r.actual_start, ae: r.actual_end, pct: r.pct, status: r.status, validated: r.validated, note: r.note || '' });
    const mapMat = r => ({ id: r.id, cat: r.cat, room: r.room || '', name: r.name, budget: num(r.budget_price) || 0, real: num(r.real_price), unit: r.unit, status: r.status, accepted: r.accepted_extra, decided: r.decided_at ? r.decided_at.slice(0, 10) : null });
    const signMany = async paths => {
      const list = paths.filter(Boolean); if (!list.length) return {};
      const r = chk(await sb.storage.from(BUCKET).createSignedUrls(list, 3600)); const o = {};
      r.forEach(x => { if (x.path) o[x.path] = x.signedUrl; }); return o;
    };
    async function upload(pid, folder, file) {
      const path = `${pid}/${folder}/${Date.now()}_${safeName(file.name)}`;
      chk(await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined }));
      return path;
    }
    return {
      live: true,
      async init() {
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
        sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
        const { data } = await sb.auth.getSession();
        if (data.session) me = await this._profile(data.session.user);
      },
      async _profile(u) {
        const { data } = await sb.from('profiles').select('name,role').eq('id', u.id).maybeSingle();
        return { id: u.id, email: u.email, name: data?.name || u.email, role: data?.role || 'client' };
      },
      user() { return me; },
      async signIn(email, password) { const r = chk(await sb.auth.signInWithPassword({ email, password })); me = await this._profile(r.user); return me; },
      async signOut() { await sb.auth.signOut(); me = null; },
      async listProjects() {
        const r = chk(await sb.from('projects').select('*, client:profiles!client_id(name)').order('created_at', { ascending: false }));
        return r.map(mapProject);
      },
      async loadBundle(pid) {
        const q = (t, o) => { let x = sb.from(t).select('*').eq('project_id', pid); if (o) x = x.order(o[0], { ascending: o[1] }); return x; };
        const [pr, ph, pt, pc, ma, ad, pa, ms, dc, up, rq] = await Promise.all([
          sb.from('projects').select('*, client:profiles!client_id(name)').eq('id', pid).single(),
          q('phases', ['sort', true]), q('photos', ['taken_at', false]), q('photo_comments', ['created_at', true]), q('materials', ['room', true]),
          q('addenda', ['added_on', false]), q('payments', ['paid_on', false]), q('messages', ['created_at', true]), q('documents', ['created_at', false]),
          q('updates', ['created_at', false]), q('change_requests', ['created_at', false])
        ]);
        const photosR = chk(pt), msgR = chk(ms);
        const urls = await signMany([...photosR.map(p => p.path), ...msgR.map(m => m.attachment_path)]);
        const comments = chk(pc);
        return {
          project: mapProject(chk(pr)), phases: chk(ph).map(mapPhase),
          photos: photosR.map(p => ({ id: p.id, phaseId: p.phase_id, path: p.path, url: urls[p.path] || null, cls: null, caption: p.caption || '', date: p.taken_at, comments: comments.filter(c => c.photo_id === p.id).map(c => ({ id: c.id, author: c.author_name || '', body: c.body, at: c.created_at.slice(0, 10) })) })),
          materials: chk(ma).map(mapMat),
          addenda: chk(ad).map(r => ({ id: r.id, desc: r.description, date: r.added_on, amount: num(r.amount), status: r.status })),
          payments: chk(pa).map(r => ({ id: r.id, label: r.label, date: r.paid_on, amount: num(r.amount), status: r.status })),
          messages: msgR.map(m => ({ id: m.id, staff: m.sender_staff, name: m.sender_name, body: m.body, at: m.created_at, att: m.attachment_path ? { url: urls[m.attachment_path], name: m.attachment_name } : null })),
          documents: chk(dc).map(d => ({ id: d.id, cat: d.category, name: d.name, path: d.path, size: d.size_bytes })),
          updates: chk(up).map(u => ({ id: u.id, kind: u.kind, text: u.text, at: u.created_at })),
          requests: chk(rq).map(r => ({ id: r.id, body: r.body, at: r.created_at }))
        };
      },
      async addComment(pid, photoId, body) {
        const r = chk(await sb.from('photo_comments').insert({ project_id: pid, photo_id: photoId, author_id: me.id, author_name: me.name, body }).select().single());
        return { id: r.id, author: me.name, body, at: r.created_at.slice(0, 10) };
      },
      async sendMessage(pid, body, file) {
        let attachment_path = null, attachment_name = null;
        if (file) { attachment_path = await upload(pid, 'chat', file); attachment_name = file.name; }
        const r = chk(await sb.from('messages').insert({ project_id: pid, sender_id: me.id, sender_name: me.name, sender_staff: me.role === 'staff', body, attachment_path, attachment_name }).select().single());
        const u = attachment_path ? (await signMany([attachment_path]))[attachment_path] : null;
        return { id: r.id, staff: r.sender_staff, name: me.name, body, at: r.created_at, att: attachment_path ? { url: u, name: attachment_name } : null };
      },
      async confirmMaterial(pid, mid, accept) { chk(await sb.rpc('confirm_material', { mid, accept })); },
      async requestChange(pid, body) { chk(await sb.from('change_requests').insert({ project_id: pid, author_id: me.id, body })); },
      async docUrl(d) { const u = await signMany([d.path]); return u[d.path]; },
      // ---- equipa ----
      async createClientProject(f) {
        const tmp = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        const su = await tmp.auth.signUp({ email: f.email, password: f.password, options: { data: { name: f.clientName } } });
        if (su.error) throw new Error(su.error.message);
        if (!su.data.user || (su.data.user.identities && !su.data.user.identities.length)) throw new Error('Este email já tem conta.');
        const row = chk(await sb.from('projects').insert({ client_id: su.data.user.id, name: f.name, address: f.address, start_date: f.start, end_date: f.end, area: f.area, base_budget: +f.base || 0, manager_name: f.mgrName }).select('*, client:profiles!client_id(name)').single());
        chk(await sb.from('phases').insert(defaultPhases(f.start, f.end).map(p => ({ project_id: row.id, kind: p.kind, sort: p.sort, planned_start: p.ps, planned_end: p.pe }))));
        return mapProject(row);
      },
      async saveProject(pid, p) { chk(await sb.from('projects').update({ name: p.name, address: p.address, status: p.status, start_date: p.start, end_date: p.end, area: p.area, base_budget: p.base, manager_name: p.mgrName }).eq('id', pid)); },
      async savePhase(pid, p) { chk(await sb.from('phases').update({ name: p.name || null, planned_start: p.ps || null, planned_end: p.pe || null, actual_start: p.as || null, actual_end: p.ae || null, pct: +p.pct, status: p.status, validated: !!p.validated, note: p.note }).eq('id', p.id)); },
      async addPhoto(pid, phaseId, file, caption, date) {
        const path = await upload(pid, 'fotos', file);
        const r = chk(await sb.from('photos').insert({ project_id: pid, phase_id: phaseId || null, path, caption, taken_at: date || today() }).select().single());
        const u = await signMany([path]);
        return { id: r.id, phaseId, path, url: u[path], cls: null, caption, date: r.taken_at, comments: [] };
      },
      async deletePhoto(pid, photoId, path) { chk(await sb.from('photos').delete().eq('id', photoId)); if (path) await sb.storage.from(BUCKET).remove([path]); },
      async saveMaterial(pid, m) {
        const row = { project_id: pid, cat: m.cat, room: m.room, name: m.name, budget_price: m.budget, real_price: m.real, unit: m.unit, status: m.status };
        chk(m.id ? await sb.from('materials').update(row).eq('id', m.id) : await sb.from('materials').insert(row));
      },
      async deleteMaterial(pid, mid) { chk(await sb.from('materials').delete().eq('id', mid)); },
      async saveAddendum(pid, a) { const row = { project_id: pid, description: a.desc, added_on: a.date, amount: a.amount, status: a.status }; chk(a.id ? await sb.from('addenda').update(row).eq('id', a.id) : await sb.from('addenda').insert(row)); },
      async savePayment(pid, a) { const row = { project_id: pid, label: a.label, paid_on: a.date, amount: a.amount, status: a.status }; chk(a.id ? await sb.from('payments').update(row).eq('id', a.id) : await sb.from('payments').insert(row)); },
      async addDocument(pid, cat, file) { const path = await upload(pid, 'docs', file); chk(await sb.from('documents').insert({ project_id: pid, category: cat, name: file.name, path, size_bytes: file.size })); },
      async deleteDocument(pid, did, path) { chk(await sb.from('documents').delete().eq('id', did)); if (path) await sb.storage.from(BUCKET).remove([path]); },
      async addUpdate(pid, kind, text) { chk(await sb.from('updates').insert({ project_id: pid, kind, text })); }
    };
  }

  window.DB = LIVE ? supa() : demo();
  window.DBU = { today, addDays, diffDays, KINDS, defaultPhases };
})();

// ---------- modal genérico ----------
function modal(html, wide) {
  const m = document.createElement('div'); m.className = 'modal open';
  m.innerHTML = `<div class="box ${wide ? 'wide' : ''}"><button class="x" aria-label="×">×</button>${html}</div>`;
  document.body.appendChild(m);
  m.result = new Promise(res => { m.close = v => { m.remove(); res(v); }; });
  $('.x', m).onclick = () => m.close(null); m.onclick = e => { if (e.target === m) m.close(null); };
  return m;
}
function ask(title, ph) {
  const m = modal(`<h3>${title}</h3><form class="f" style="margin-top:14px"><textarea rows="4" required placeholder="${esc(ph)}"></textarea><div class="btns"><button class="btn sm">${t('send_b')}</button><button type="button" class="btn ghost" data-c>${t('cancel')}</button></div></form>`);
  const f = $('form', m);
  f.onsubmit = e => { e.preventDefault(); m.close($('textarea', f).value.trim()); }; $('[data-c]', m).onclick = () => m.close(null);
  return m.result;
}
const busy = async (fn, ok) => { try { await fn(); if (ok) toast(ok); return true; } catch (e) { toast((lang === 'pt' ? 'Erro: ' : 'Error: ') + (e.message || e)); return false; } };

// ---------- router ----------
async function route() {
  stopTimers();
  const h = location.hash.replace(/^#\/?/, '');
  ST.user = DB.user();
  if (h.startsWith('gestao')) {
    if (!ST.user || ST.user.role !== 'staff') { location.hash = '#/'; setTimeout(openLogin, 60); return; }
    return staffRoute(h.split('/').slice(1));
  }
  if (h.startsWith('area')) {
    if (!ST.user) { location.hash = '#/'; setTimeout(openLogin, 60); return; }
    if (ST.user.role === 'staff') { location.hash = '#/gestao'; return; }
    $('#app').innerHTML = `<p style="padding:40px;text-align:center">${t('loading')}</p>`;
    try {
      ST.projects = await DB.listProjects();
      if (!ST.projects.find(p => p.id === ST.pid)) ST.pid = ST.projects[0]?.id;
      ST.B = ST.pid ? await DB.loadBundle(ST.pid) : null;
    } catch (e) { toast(e.message); }
    ST.page = h.split('/')[1] || 'dashboard';
    if (!MENU.some(m => m[0] === ST.page)) ST.page = 'dashboard';
    return renderClient();
  }
  renderPublic();
  if (h) requestAnimationFrame(() => { const el = document.getElementById(h); el && el.scrollIntoView(); });
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const l = e.target.closest('a.logo, a.top-logo, .ftr .logo-img'); if (!l) return;
  e.preventDefault();
  if (location.hash === '#/' || location.hash === '' || location.hash === '#') { route(); window.scrollTo(0, 0); }
  else { location.hash = '#/'; window.scrollTo(0, 0); }
});
function setLang(l) { lang = l; try { localStorage.setItem('oce-lang', l); } catch (e) {} const y = window.scrollY; const h = location.hash; Promise.resolve(h.startsWith('#/area') ? renderClient() : route()).then(() => { window.scrollTo(0, y); requestAnimationFrame(() => window.scrollTo(0, y)); }); }
const banner = () => (DB.live ? '' : `<div class="banner">${t('demo_banner')}</div>`);

let MOCK_T = 0;
function initMock() {
  clearTimeout(MOCK_T);
  const m = $('.mock'); if (!m) return;
  const items = $$('.mk-side>span:not(.mk-out)', m), views = $$('.mk-v', m), cur = $('.mk-cursor', m);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let idx = 0, auto = !reduce, vis = false, idle = 0, tm = 0;
  const show = i => { idx = i; items.forEach((e, k) => e.classList.toggle('on', k === i)); views.forEach((v, k) => v.classList.toggle('on', k === i)); };
  const moveTo = el => { const r = el.getBoundingClientRect(), mr = m.getBoundingClientRect(); cur.style.transform = `translate(${r.left - mr.left + r.width * .55}px,${r.top - mr.top + r.height * .5}px)`; };
  const click = () => { cur.classList.remove('click'); void cur.offsetWidth; cur.classList.add('click'); };
  const step = () => {
    if (!auto || !vis) return;
    const nx = (idx + 1) % items.length; cur.classList.add('on'); moveTo(items[nx]);
    tm = setTimeout(() => { click(); show(nx); tm = setTimeout(step, 1100); }, 500);
  };
  const stop = () => { auto = false; clearTimeout(tm); clearTimeout(idle); cur.classList.remove('on'); };
  const resume = ms => { clearTimeout(idle); if (reduce) return; idle = setTimeout(() => { auto = true; step(); }, ms); };
  items.forEach((e, i) => e.addEventListener('click', () => { stop(); show(i); resume(9000); }));
  m.addEventListener('pointerenter', () => { stop(); });
  m.addEventListener('pointerleave', () => resume(2500));
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => { vis = es[0].isIntersecting; if (vis && auto) { clearTimeout(tm); moveTo(items[idx]); tm = setTimeout(step, 350); } else if (!vis) clearTimeout(tm); }, { threshold: .35 }).observe(m);
  } else { vis = true; step(); }
  MOCK_T = 0;
}

/* ===================== CHATBOT (canto inferior direito) ===================== */
const BOT_RULES = [ // ordem importa: a primeira que corresponder responde
  ['quote', /or[cç]ament|pre[cç]o|quanto|custa|quote|price|cost|budget|estimate/i, 'contact'],
  ['client', /cliente|login|acesso|portal|client|access|sign.?in|dashboard/i, 'login'],
  ['serv', /servi[cç]|remodel|reabilit|design|interior|obra|renov|service|works?/i, null],
  ['contact', /contact|telefone|telem|email|morada|falar|ligar|phone|address|reach|call/i, 'contact']
];
ST.bot = ST.bot || { open: false, msgs: [], busy: false };
function botReply(text) {
  for (const [k, re, act] of BOT_RULES) if (re.test(text)) return { text: t('bot_r_' + k), act };
  return { text: /^(ol[aá]|bom|boa|oi|hello|hi|hey)\b/i.test(text.trim()) ? t('bot_hi') : t('bot_r_default'), act: null };
}
async function botAnswer(text) {
  const url = (window.OCE_CONFIG || {}).CHATBOT_URL;
  if (url) { // endpoint próprio (IA no servidor); em falha, cai nas respostas integradas
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history: ST.bot.msgs.slice(-10), lang }) });
      if (r.ok) { const d = await r.json(); if (d && d.reply) return { text: String(d.reply), act: null }; }
    } catch (e) { /* usa respostas integradas */ }
  }
  return botReply(text);
}
function botDraw() {
  const b = ST.bot, root = $('#bot'); if (!root) return;
  const msgs = b.msgs.length ? b.msgs : [{ role: 'bot', text: t('bot_hi') }];
  root.innerHTML = `
  <button class="bot-fab" id="botFab" aria-label="${b.open ? t('bot_close') : t('bot_open')}" aria-expanded="${b.open}" aria-controls="botPanel">${b.open ? ico('x', 22) : ico('chat', 24)}</button>
  <section class="bot-panel ${b.open ? 'open' : ''}" id="botPanel" role="dialog" aria-label="${t('bot_title')}" ${b.open ? '' : 'hidden'}>
    <header><div class="bot-av" aria-hidden="true">E</div><div><b>${t('bot_title')}</b><small>${t('bot_sub')}</small></div><button id="botX" aria-label="${t('bot_close')}">${ico('x', 18)}</button></header>
    <div class="bot-msgs" id="botMsgs" aria-live="polite">${msgs.map(m => `<div class="bot-m ${m.role}">${esc(m.text)}${m.act ? `<button class="bot-act" data-act="${m.act}">${t(m.act === 'login' ? 'bot_a_login' : 'bot_a_contact')}</button>` : ''}</div>`).join('')}${b.busy ? `<div class="bot-m bot typing" aria-label="${t('bot_typing')}"><i></i><i></i><i></i></div>` : ''}</div>
    <div class="bot-chips">${[['bot_c1', 'serv'], ['bot_c2', 'quote'], ['bot_c3', 'client'], ['bot_c4', 'contact']].map(([k, q]) => `<button data-q="${q}">${t(k)}</button>`).join('')}</div>
    <form class="bot-f" id="botF"><input id="botI" type="text" placeholder="${t('bot_ph')}" autocomplete="off" maxlength="300" aria-label="${t('bot_ph')}"><button aria-label="${t('bot_send')}">${ico('send', 18)}</button></form>
  </section>`;
  const box = $('#botMsgs'); box.scrollTop = box.scrollHeight;
  const toggle = o => { b.open = o; botDraw(); if (o) $('#botI').focus(); };
  $('#botFab').onclick = () => toggle(!b.open); $('#botX').onclick = () => toggle(false);
  $('#botPanel').onkeydown = e => { if (e.key === 'Escape') toggle(false); };
  const send = async text => {
    if (!text || b.busy) return; b.msgs = (b.msgs.length ? b.msgs : [{ role: 'bot', text: t('bot_hi') }]).concat({ role: 'user', text }); b.busy = true; botDraw(); $('#botI').focus();
    const [ans] = await Promise.all([botAnswer(text), new Promise(r => setTimeout(r, 550))]);
    b.busy = false; b.msgs.push({ role: 'bot', text: ans.text, act: ans.act }); botDraw(); $('#botI').focus();
  };
  $('#botF').onsubmit = e => { e.preventDefault(); const v = $('#botI').value.trim(); if (v) send(v); };
  $$('.bot-chips button').forEach(c => c.onclick = () => send({ serv: t('bot_c1'), quote: t('bot_c2'), client: t('bot_c3'), contact: t('bot_c4') }[c.dataset.q]));
  $$('.bot-act').forEach(a => a.onclick = () => { if (a.dataset.act === 'login') { toggle(false); openLogin(); } else { toggle(false); const el = document.getElementById('contact'); el && el.scrollIntoView({ behavior: 'smooth' }); } });
}
